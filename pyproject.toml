[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "reconface"
version = "0.1.0"
description = "Production-ready Reverse Face Recognition & Search System for OSINT/recon operations"
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
authors = [
    { name = "ReconFace Team" },
]

dependencies = [
    # --- Web Framework ---
    "fastapi[standard]>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "pydantic>=2.0.0",
    "pydantic-settings>=2.0.0",
    "python-multipart>=0.0.9",

    # --- Face Detection & ML ---
    "insightface>=0.7.3",
    "onnxruntime>=1.18.0",
    "opencv-python-headless>=4.10.0",
    "Pillow>=10.0.0",
    "numpy>=1.26.0",

    # --- Vector Database ---
    "qdrant-client>=1.10.0",

    # --- Task Queue ---
    "celery[redis]>=5.4.0",
    "redis>=5.0.0",

    # --- HTTP Client ---
    "httpx>=0.27.0",

    # --- Object Storage ---
    "minio>=7.2.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.24.0",
    "pytest-cov>=5.0.0",
    "ruff>=0.5.0",
    "mypy>=1.10.0",
]
gpu = [
    "onnxruntime-gpu>=1.18.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
filterwarnings = [
    "ignore::DeprecationWarning",
]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP"]

[tool.mypy]
python_version = "3.11"
strict = true
warn_return_any = true
warn_unused_configs = true
